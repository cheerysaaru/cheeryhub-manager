name = "cheeryhub-api"
main = "src/worker.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "personal-productivity-db"
database_id = "dba971a7-05f8-437b-acae-e7b6336bf9f6"
migrations_dir = "migrations"

[[routes]]
pattern = "api.cheeryhub.space"
custom_domain = true

[vars]
FRONTEND_URL = "https://cheeryhub.space,https://cheerysaaru.github.io"
NODE_ENV = "production"
EMAIL_FROM = "Productivity <onboarding@resend.dev>"
APP_URL = "https://cheeryhub.space"
