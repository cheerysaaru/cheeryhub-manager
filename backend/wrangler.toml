name = "cheeryhub-api"
main = "src/index.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "personal-productivity-db"
database_id = "dba971a7-05f8-437b-acae-e7b6336bf9f6"
migrations_dir = "migrations"

[[routes]]
pattern = "api.cheeryhub.space"
custom_domain = true

[vars]
FRONTEND_URL = "https://cheeryhub.space,https://www.cheeryhub.space,https://cheerysaaru.github.io"
NODE_ENV = "production"
EMAIL_FROM = "Productivity <onboarding@resend.dev>"
APP_URL = "https://cheeryhub.space"

# Secrets — never put these in [vars] or in this file:
#   npx wrangler secret put JWT_SECRET      # required, 32+ chars
#   npx wrangler secret put EMAIL_API_KEY   # optional (Resend), enables email
# The worker refuses to start without JWT_SECRET and logs the name of every
# missing variable (values are never printed).

# Staging is intended for local Wrangler dev with a remote, isolated D1 binding:
#   npx wrangler dev --env staging --remote
# It has no route bound to the production API hostname.
[env.staging]
name = "cheeryhub-api-staging"
workers_dev = true
routes = []

[env.staging.vars]
FRONTEND_URL = "http://localhost:5173,http://127.0.0.1:5173"
NODE_ENV = "development"
EMAIL_FROM = "Productivity <onboarding@resend.dev>"
APP_URL = "http://localhost:5173"
COOKIE_SECURE = "false"
COOKIE_SAME_SITE = "lax"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "cheeryhub-staging-db"
database_id = "252f2084-f40d-4c93-91ff-1f7c08f05854"
migrations_dir = "migrations"

# One Durable Object per user (SQLite-backed) for per-user isolation.
[[durable_objects.bindings]]
name = "USER_DO"
class_name = "UserDO"

# SQLite-backed Durable Object class.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDO"]

